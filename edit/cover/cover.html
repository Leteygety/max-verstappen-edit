<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --ink: #eef1f5;
    --rb-red: #ff2338;
    --rb-yellow: #ffc906;
    --rb-blue: #2a4dff;
    --mono: "DejaVu Sans Mono", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background:
      radial-gradient(900px 700px at 12% 22%, rgba(52, 86, 150, .42), transparent 70%),
      radial-gradient(800px 600px at 95% 70%, rgba(150, 20, 34, .30), transparent 70%),
      radial-gradient(1200px 900px at 50% 55%, rgba(30, 36, 48, .55), transparent 75%),
      #040507;
    font-family: "Inter Display", "Inter", sans-serif;
    color: var(--ink);
    position: relative;
  }
  /* light streaks: long exposure of a car passing */
  .streak { position: absolute; left: -200px; width: 1500px; transform: rotate(-9deg); border-radius: 50%; }
  .s1 { top: 850px; height: 10px; filter: blur(3px);
        background: linear-gradient(90deg, transparent 0%, var(--rb-red) 30%, var(--rb-yellow) 62%, #fff 74%, transparent 100%); }
  .s2 { top: 825px; height: 70px; filter: blur(36px); opacity: .75;
        background: linear-gradient(90deg, transparent 5%, var(--rb-red) 35%, var(--rb-yellow) 65%, transparent 95%); }
  .s3 { top: 955px; height: 4px; filter: blur(2px); opacity: .9;
        background: linear-gradient(90deg, transparent 10%, var(--rb-blue) 45%, #9fb3ff 70%, transparent 100%); }
  .s4 { top: 935px; height: 50px; filter: blur(30px); opacity: .55;
        background: linear-gradient(90deg, transparent 10%, var(--rb-blue) 50%, transparent 100%); }
  .s5 { top: 585px; height: 2px; filter: blur(1px); opacity: .35;
        background: linear-gradient(90deg, transparent 20%, #fff 60%, transparent 100%); }

  .max {
    position: absolute; left: 0; right: 0; top: 535px; text-align: center;
    font-weight: 900; font-size: 450px; line-height: 1; letter-spacing: -0.06em; padding-right: .06em;
  }
  .max span { position: absolute; left: 0; right: 0; }
  .max .r { color: var(--rb-red); transform: translateX(-6px); opacity: .7; filter: blur(1px); }
  .max .c { color: #2fd9ff; transform: translateX(5px); opacity: .45; filter: blur(1px); }
  .max .w {
    background: linear-gradient(180deg, #ffffff 0%, #d9dee6 45%, #6d7480 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .name {
    position: absolute; left: 0; right: 0; top: 1063px; text-align: center;
    font-weight: 800; font-size: 112px; letter-spacing: .09em; padding-left: .09em;
    color: var(--ink);
  }
  .years {
    position: absolute; left: 0; right: 0; top: 1215px; text-align: center;
    font-family: var(--mono); font-size: 30px; letter-spacing: .32em; color: rgba(238,241,245,.78);
  }
  .years b { color: var(--rb-yellow); font-weight: 400; }

  .bar { position: absolute; left: 70px; right: 70px; height: 1px; background: rgba(238,241,245,.22); }
  .meta { position: absolute; font-family: var(--mono); font-size: 25px; letter-spacing: .22em;
          color: rgba(238,241,245,.7); }
  .tl { top: 278px; left: 70px; }
  .tr { top: 278px; right: 70px; }
  .tr i { font-style: normal; color: var(--rb-red); }
  .car { position: absolute; left: -150px; top: 1275px; width: 1250px; }

  /* registration marks */
  .mark { position: absolute; width: 46px; height: 46px; border-color: rgba(238,241,245,.45); border-style: solid; }
  .m1 { top: 228px; left: 50px;  border-width: 2px 0 0 2px; }
  .m2 { top: 228px; right: 50px; border-width: 2px 2px 0 0; }
  .m3 { top: 1600px; left: 50px;  border-width: 0 0 2px 2px; }
  .m4 { top: 1600px; right: 50px; border-width: 0 2px 2px 0; }
</style>
</head>
<body>
  <div class="streak s2"></div>
  <div class="streak s4"></div>
  <div class="streak s5"></div>

  <div class="mark m1"></div><div class="mark m2"></div>
  <div class="mark m3"></div><div class="mark m4"></div>

  <div class="meta tl">F1 / FAN EDIT</div>
  <div class="meta tr"><i>●</i> 4× WORLD CHAMPION</div>
  <div class="bar" style="top:330px"></div>

  <div class="max">
    <span class="r">MAX</span>
    <span class="c">MAX</span>
    <span class="w">MAX</span>
  </div>

  <div class="streak s1"></div>
  <div class="streak s3"></div>

  <div class="name">VERSTAPPEN</div>
  <div class="years">2021 <b>—</b> 2022 <b>—</b> 2023 <b>—</b> 2024</div>

  <img class="car" src="car.svg" alt="">
</body>
</html>
